<svg width="300" height="250" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad4" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#072534;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0B4F6C;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#14B8A6;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="300" height="250" fill="url(#grad4)"/>
  <g transform="translate(20, 20)">
    <!-- Growth chart -->
    <polyline points="20,180 45,165 70,145 95,125 120,105 145,85 170,75 195,60 220,45 240,30"
              stroke="#FFFFFF" stroke-width="3" fill="none" opacity="0.9"/>
    <circle cx="20" cy="180" r="3" fill="#FFFFFF"/>
    <circle cx="45" cy="165" r="3" fill="#FFFFFF"/>
    <circle cx="70" cy="145" r="3" fill="#FFFFFF"/>
    <circle cx="95" cy="125" r="3" fill="#FFFFFF"/>
    <circle cx="120" cy="105" r="3" fill="#FFFFFF"/>
    <circle cx="145" cy="85" r="3" fill="#FFFFFF"/>
    <circle cx="170" cy="75" r="3" fill="#FFFFFF"/>
    <circle cx="195" cy="60" r="3" fill="#FFFFFF"/>
    <circle cx="220" cy="45" r="3" fill="#FFFFFF"/>
    <circle cx="240" cy="30" r="5" fill="#5EEAD4"/>

    <!-- Grid lines -->
    <line x1="20" y1="180" x2="20" y2="20" stroke="#FFFFFF" stroke-width="1" opacity="0.2"/>
    <line x1="20" y1="180" x2="240" y2="180" stroke="#FFFFFF" stroke-width="1" opacity="0.2"/>
    <line x1="20" y1="140" x2="240" y2="140" stroke="#FFFFFF" stroke-width="1" opacity="0.15"/>
    <line x1="20" y1="100" x2="240" y2="100" stroke="#FFFFFF" stroke-width="1" opacity="0.15"/>
    <line x1="20" y1="60" x2="240" y2="60" stroke="#FFFFFF" stroke-width="1" opacity="0.15"/>

    <!-- Upward arrow -->
    <path d="M 230 50 L 230 25" stroke="#5EEAD4" stroke-width="2" fill="none" opacity="0.9"/>
    <polygon points="225,30 230,25 235,30" fill="#5EEAD4" opacity="0.9"/>
  </g>
</svg>
