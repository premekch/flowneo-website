<svg width="300" height="250" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0B4F6C;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#14B8A6;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="300" height="250" fill="url(#grad2)"/>
  <g transform="translate(10, 40)">
    <!-- Workflow steps -->
    <rect x="40" y="0" width="70" height="70" rx="8" fill="#FFFFFF" opacity="0.9"/>
    <rect x="220" y="0" width="150" height="140" rx="8" fill="#FFFFFF" opacity="0.9"/>
    <rect x="40" y="200" width="50" height="40" rx="8" fill="#FFFFFF" opacity="0.9"/>
	<rect x="220" y="200" width="50" height="40" rx="8" fill="#FFFFFF" opacity="0.9"/>
    <!--<rect x="255" y="0" width="0" height="45" rx="8" fill="#FFFFFF" opacity="0.9"/>-->

    <!-- Arrows -->
    <path d="M 65 22 L 85 22" stroke="#FFFFFF" stroke-width="2" fill="none" opacity="0.8"/>
    <path d="M 150 22 L 170 22" stroke="#FFFFFF" stroke-width="2" fill="none" opacity="0.8"/>
    <polygon points="82,19 85,22 82,25" fill="#FFFFFF" opacity="0.8"/>
    <polygon points="167,19 170,22 167,25" fill="#FFFFFF" opacity="0.8"/>

    <!-- Step labels -->
    <text x="39" y="30" font-family="Arial" font-size="11" fill="#0B4F6C" text-anchor="middle" font-weight="bold">Vstup</text>
    <text x="109" y="30" font-family="Arial" font-size="11" fill="#0B4F6C" text-anchor="middle" font-weight="bold">Analýza</text>
	<text x="179" y="30" font-family="Arial" font-size="11" fill="#0B4F6C" text-anchor="middle" font-weight="bold">Zprac.</text>
	<text x="239" y="30" font-family="Arial" font-size="11" fill="#0B4F6C" text-anchor="middle" font-weight="bold">Výstup</text>
    

    <!-- Flow lines below 
