<svg width="300" height="250" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#072534;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0B4F6C;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#14B8A6;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="300" height="250" fill="url(#grad1)"/>
  <g transform="translate(20, 30)">
    <!-- Connected nodes representing automation -->
    <circle cx="40" cy="60" r="20" fill="#FFFFFF" opacity="0.9"/>
    <circle cx="130" cy="60" r="20" fill="#FFFFFF" opacity="0.9"/>
    <circle cx="220" cy="60" r="20" fill="#FFFFFF" opacity="0.9"/>
    <circle cx="95" cy="140" r="20" fill="#FFFFFF" opacity="0.9"/>
    <circle cx="185" cy="140" r="20" fill="#FFFFFF" opacity="0.9"/>

    <!-- Connection lines -->
    <line x1="40" y1="60" x2="130" y2="60" stroke="#5EEAD4" stroke-width="2" opacity="0.8"/>
	<line x1="130" y1="60" x2="220" y2="60" stroke="#5EEAD4" stroke-width="2" opacity="0.8"/>
    <line x1="40" y1="60" x2="95" y2="140" stroke="#5EEAD4" stroke-width="2" opacity="0.8"/>
    <line x1="95" y1="140" x2="130" y2="60" stroke="#5EEAD4" stroke-width="2" opacity="0.8"/>
    <line x1="95" y1="140" x2="185" y2="140" stroke="#5EEAD4" stroke-width="2" opacity="0.8"/>
    <line x1="130" y1="60" x2="185" y2="140" stroke="#5EEAD4" stroke-width="2" opacity="0.8"/>
    <line x1="185" y1="140" x2="220" y2="60" stroke="#5EEAD4" stroke-width="2" opacity="0.8"/>
    

    <!-- Icons in circles -->
    <text x="40" y="57" font-family="Arial" font-size="12" fill="#3E6A94" text-anchor="middle" font-weight="bold">CRM</text>
    <text x="130" y="57" font-family="Arial" font-size="12" fill="#3E6A94" text-anchor="middle" font-weight="bold">PRO</text>
    <text x="220" y="57" font-family="Arial" font-size="12" fill="#3E6A94" text-anchor="middle" font-weight="bold">BILL</text>
    <text x="95" y="149" font-family="Arial" font-size="12" fill="#3E6A94" text-anchor="middle" font-weight="bold">AUTO</text>
    <text x="185" y="149" font-family="Arial" font-size="12" fill="#3E6A94" text-anchor="middle" font-weight="bold">DATA</text>
  </g>
</svg>
