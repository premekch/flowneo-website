<svg width="600" height="400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#072534;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1978A5;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#grad3)"/>
  <g transform="translate(50, 50)">
    <!-- Old system (left) - messy -->
    <rect x="0" y="0" width="200" height="300" rx="5" fill="#FFFFFF" opacity="0.15"/>
    <line x1="20" y1="40" x2="180" y2="40" stroke="#FFFFFF" stroke-width="2" opacity="0.4"/>
    <line x1="20" y1="80" x2="180" y2="80" stroke="#FFFFFF" stroke-width="2" opacity="0.4"/>
    <line x1="20" y1="120" x2="180" y2="120" stroke="#FFFFFF" stroke-width="2" opacity="0.4"/>
    <line x1="20" y1="160" x2="180" y2="160" stroke="#FFFFFF" stroke-width="2" opacity="0.4"/>
    <text x="100" y="220" font-family="Arial" font-size="18" fill="#FFFFFF" text-anchor="middle">Excel chaos</text>

    <!-- Arrow -->
    <path d="M 250 150 L 350 150" stroke="#5EEAD4" stroke-width="6" fill="none"/>
    <polygon points="345,145 350,150 345,155" fill="#5EEAD4"/>

    <!-- New system (right) - organized -->
    <rect x="400" y="0" width="150" height="300" rx="10" fill="#FFFFFF" opacity="0.95"/>
    <rect x="420" y="30" width="110" height="40" rx="5" fill="#0B4F6C" opacity="0.9"/>
    <rect x="420" y="90" width="110" height="40" rx="5" fill="#14B8A6" opacity="0.9"/>
    <rect x="420" y="150" width="110" height="40" rx="5" fill="#1978A5" opacity="0.9"/>
    <rect x="420" y="210" width="110" height="40" rx="5" fill="#0D9488" opacity="0.9"/>
    <text x="475" y="260" font-family="Arial" font-size="18" fill="#1A2B3C" text-anchor="middle" font-weight="bold">Organizovaný systém</text>

    <!-- Cloud icon -->
    <circle cx="475" cy="50" r="15" fill="#FFFFFF" opacity="0.9"/>
    <circle cx="460" cy="50" r="12" fill="#FFFFFF" opacity="0.9"/>
    <circle cx="490" cy="50" r="12" fill="#FFFFFF" opacity="0.9"/>
  </g>
  <text x="300" y="380" font-family="Arial" font-size="24" fill="#FFFFFF" text-anchor="middle" font-weight="bold">Systém místo tabulek</text>
</svg>
