<svg width="300" height="250" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#072534;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1978A5;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="300" height="250" fill="url(#grad3)"/>
  <g transform="translate(10, 20)">
    <!-- Old system (left) - messy -->
    <rect x="0" y="0" width="90" height="160" rx="4" fill="#FFFFFF" opacity="0.15"/>
    <line x1="10" y1="25" x2="80" y2="25" stroke="#FFFFFF" stroke-width="1" opacity="0.4"/>
    <line x1="10" y1="50" x2="80" y2="50" stroke="#FFFFFF" stroke-width="1" opacity="0.4"/>
    <line x1="10" y1="75" x2="80" y2="75" stroke="#FFFFFF" stroke-width="1" opacity="0.4"/>
    <line x1="10" y1="100" x2="80" y2="100" stroke="#FFFFFF" stroke-width="1" opacity="0.4"/>
    <text x="45" y="140" font-family="Arial" font-size="10" fill="#FFFFFF" text-anchor="middle">Excel</text>

    <!-- Arrow -->
    <path d="M 110 80 L 150 80" stroke="#5EEAD4" stroke-width="3" fill="none"/>
    <polygon points="145,76 150,80 145,84" fill="#5EEAD4"/>

    <!-- New system (right) - organized -->
    <rect x="160" y="0" width="80" height="160" rx="8" fill="#FFFFFF" opacity="0.95"/>
    <rect x="172" y="18" width="56" height="25" rx="4" fill="#0B4F6C" opacity="0.9"/>
    <rect x="172" y="50" width="56" height="25" rx="4" fill="#14B8A6" opacity="0.9"/>
    <rect x="172" y="82" width="56" height="25" rx="4" fill="#1978A5" opacity="0.9"/>
    <rect x="172" y="114" width="56" height="25" rx="4" fill="#0D9488" opacity="0.9"/>
    <text x="200" y="155" font-family="Arial" font-size="10" fill="#1A2B3C" text-anchor="middle" font-weight="bold">Systém</text>

    <!-- Cloud icon -->
    <circle cx="200" cy="25" r="10" fill="#FFFFFF" opacity="0.8"/>
    <circle cx="190" cy="25" r="7" fill="#FFFFFF" opacity="0.8"/>
    <circle cx="210" cy="25" r="7" fill="#FFFFFF" opacity="0.8"/>
  </g>
</svg>
